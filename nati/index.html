<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mi página básica</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f4f4f4;
    }
    header, footer {
      background: #333;
      color: #fff;
      padding: 10px 20px;
    }
    main {
      background: #fff;
      padding: 20px;
      margin-top: 10px;
      border-radius: 4px;
    }
    label {
      display: block;
      margin-top: 10px;
    }
    input[type="text"], input[type="email"] {
      width: 100%;
      padding: 8px;
      margin-top: 4px;
      box-sizing: border-box;
    }
    button {
      margin-top: 15px;
      padding: 8px 12px;
      background: #007bff;
      color: #fff;
      border: none;
      cursor: pointer;
    }
    button:hover {
      background: #0056b3;
    }
  </style>
</head>
<body>
  <header>
    <h1>Formulario de contacto </h1>
  </header>

   <h3>Formulario de contacto</h3>

<form id="contacto" action="#" method="post">
  <label for="nombre">Nombre</label>
  <input id="nombre" name="nombre" type="text" required minlength="3">

  <label for="email">Correo electrónico</label>
  <input id="email" name="email" type="email" required>

  <label for="asunto">Asunto</label>
  <input id="asunto" name="asunto" type="text" required>

  <label for="mensaje">Mensaje</label>
  <textarea id="mensaje" name="mensaje" rows="5" required minlength="10"></textarea>

  <button type="submit">Enviar</button>
</form>

<p id="resultado" style="display:none; margin-top:10px; color:green;">
  ¡Tu mensaje ha sido enviado correctamente!
</p>

<script>
  document.getElementById("contacto").addEventListener("submit", function(e) {
    e.preventDefault(); // Evita recargar la página
    document.getElementById("resultado").style.display = "block";
    this.reset(); // Limpia el formulario
  });
</script>


  <footer>
    <p>&copy; 2026 Mi sitio</p>
  </footer>
</body>
</html>
