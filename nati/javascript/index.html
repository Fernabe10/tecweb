<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicios JavaScript</title>
</head>
<body>

<h1>Ejercicios de JavaScript</h1>

<select id="ejercicio">
    <option value="">Selecciona un ejercicio</option>
    <option value="1_holamundo">Hola Mundo</option>
    <option value="2_variables">Variables</option>
    <option value="3_entrada_datos">Entrada de datos</option>
    <option value="4_secuenciales">Secuenciales</option>
    <option value="5_condicionales_simples">Condicionales simples</option>
    <option value="6_condicionales_compuestas">Condicionales compuestas</option>
</select>

<button onclick="cargar()">Ejecutar</button>

<script>
function cargar() {
    const ejercicio = document.getElementById("ejercicio").value;

    if (!ejercicio) return;

    const script = document.createElement("script");
    script.src = `code/${ejercicio}.js`;

    document.body.appendChild(script);
}
</script>

</body>
</html>
